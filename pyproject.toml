[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayzero"
version = "0.2.0"
description = "DAY ZERO — Founder Formation & Technical Diligence Engine"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["network: requires internet access (excluded from the standard run)"]
addopts = "-m 'not network' -q"
