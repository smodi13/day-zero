# PHASE 4 UNSEEN V2 VALIDATION COHORT
#
# FROZEN BEFORE ANY PRE-CUTOFF EVIDENCE WAS RETRIEVED.
#
# Selection is deterministic: SHA256(v2_frozen_hash + ':' + case_id), sorted ascending,
# first 12. Only 9 cases were eligible, so all 9 are used. No case was chosen by hand,
# and no case was swapped out after inspecting whether the system could find it.
#
# NOTHING IN THIS FILE DESCRIBES A LATER OUTCOME. No traction, no acquisition, no
# current status, no post-cutoff financing. Only what was needed to establish
# eligibility: company, founder/team where public, Array relationship, and a cutoff.
v2_frozen_hash: "435dfb8a568d8f07124125b08566cc9ced48f4d17ef76064978905968287f434"
selection_method: "sha256(v2_frozen_hash + ':' + case_id) ascending, take first 12"
target_cohort_size: 12
eligible_count: 9
selected_count: 9
cutoff_rule: >-
  The day before the earliest financing announcement with an exact, verifiable public
  date in which Array's relationship is publicly established. A case whose announcement
  date could not be established is excluded as CUTOFF_DATE_UNRESOLVED, never because it
  looked difficult.
permitted_source_types: [github_repo, github_org, github_commits, github_releases,
  package_registry, arxiv_paper, project_site, company_site, mailing_list, press]
