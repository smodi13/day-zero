# PHASE 4 UNSEEN COHORT — AS-OF EVIDENCE PACKETS.
#
# Retrieved AFTER the cohort was frozen in commit 63cfcefdb54ce9d95b57e0e9a3b54be3988f2516.
# Every item is dated by when the underlying fact existed. Nothing post-cutoff appears.
#
# Entity resolution follows v2 identity rules unchanged: an organisation is only accepted
# as belonging to a company when a first-party link verifies it (ER-1). A name-only match
# is POSSIBLE_MATCH and its artifacts may NOT be used as evidence. Several cases below
# resolve to UNKNOWN for exactly that reason, and that is the rule working, not a gap.
