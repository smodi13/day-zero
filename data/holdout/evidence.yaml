# AS-OF EVIDENCE PACKETS.
#
# Every item is dated by WHEN THE UNDERLYING FACT EXISTED, not when it was retrieved.
# `artifact_available_at_cutoff` records whether the artifact itself was publicly
# available at the cutoff: a 2026 retrieval of a 2022 commit is legitimate; a 2025
# article describing that 2022 event is not automatically valid evidence for what an
# investor could have known in 2023.
#
# NO post-cutoff information appears here. Outcomes live in outcomes.yaml.
# Where nothing is listed for a case, nothing recoverable was found — that is a
# result, not an omission.
